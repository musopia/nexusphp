services:
  php:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      dockerfile: .docker/php/Dockerfile
    image: nexusphp_php
    container_name: nexusphp-php
    ports:
      - "${NP_HOST_BIND:-172.17.0.1}:${NP_PHP_PORT:-19000}:9000"
    environment:
      NP_BACKUP_EXPORT_PATH: ${NP_BACKUP_EXPORT_PATH:-/tmp/nexusphp_backup}
      SERVICE_NAME: php
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-13306}
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-16379}
    volumes:
      - .:/var/www/html
      - ${NP_BACKUP_DATA_PATH:-./backup_data}:${NP_BACKUP_EXPORT_PATH:-/tmp/nexusphp_backup}
    depends_on:
      - mysql
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet

  queue:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    image: nexusphp_php
    container_name: nexusphp-queue
    environment:
      NP_BACKUP_EXPORT_PATH: ${NP_BACKUP_EXPORT_PATH:-/tmp/nexusphp_backup}
      SERVICE_NAME: queue
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-13306}
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-16379}
    volumes:
      - .:/var/www/html
      - ${NP_BACKUP_DATA_PATH:-./backup_data}:${NP_BACKUP_EXPORT_PATH:-/tmp/nexusphp_backup}
    depends_on:
      - php
      - redis
      - mysql
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet
    restart: always

  scheduler:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    image: nexusphp_php
    container_name: nexusphp-scheduler
    environment:
      NP_BACKUP_EXPORT_PATH: ${NP_BACKUP_EXPORT_PATH:-/tmp/nexusphp_backup}
      SERVICE_NAME: scheduler
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-13306}
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-16379}
    volumes:
      - .:/var/www/html
      - ${NP_BACKUP_DATA_PATH:-./backup_data}:${NP_BACKUP_EXPORT_PATH:-/tmp/nexusphp_backup}
    depends_on:
      - php
      - redis
      - mysql
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet
    restart: always

  cleanup:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    image: nexusphp_php
    container_name: nexusphp-cleanup
    environment:
      NP_BACKUP_EXPORT_PATH: ${NP_BACKUP_EXPORT_PATH:-/tmp/nexusphp_backup}
      SERVICE_NAME: cleanup
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-13306}
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-16379}
    volumes:
      - .:/var/www/html
      - ${NP_BACKUP_DATA_PATH:-./backup_data}:${NP_BACKUP_EXPORT_PATH:-/tmp/nexusphp_backup}
    depends_on:
      - php
      - redis
      - mysql
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet
    restart: always

  openresty:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      dockerfile: .docker/openresty/Dockerfile
    container_name: nexusphp-openresty
    environment:
      NP_DOMAIN: ${NP_DOMAIN:-localhost}
      NP_PORT: ${NP_PORT:-80}
      NP_PHP_PORT: ${NP_PHP_PORT:-19000}
      NP_PMA_PORT: ${NP_PMA_PORT:-18081}
    volumes:
      - ./.docker/openresty/sites:/etc/nginx/conf.d/sites
      - ./.docker/openresty/certs:/certs
      - ./.docker/openresty/entrypoint.sh:/usr/local/bin/entrypoint.sh
      - ./.docker/openresty/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf
      - ./.docker/openresty/lua:/usr/local/openresty/lua
      - .:/var/www/html
    depends_on:
      - php
      - phpmyadmin
    command: ["/bin/sh", "/usr/local/bin/entrypoint.sh"]
    ports:
      - "${NP_PORT:-80}:${NP_PORT:-80}"
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet

  redis:
    image: redis:alpine
    container_name: nexusphp-redis
    ports:
      - "${NP_HOST_BIND:-172.17.0.1}:${REDIS_PORT:-16379}:6379"
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    volumes:
      - ${NP_REDIS_DATA_PATH:-./redis_data}:/data
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet

  mysql:
    image: mysql:9
    container_name: nexusphp-mysql
    ports:
      - "${NP_HOST_BIND:-172.17.0.1}:${DB_PORT:-13306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-nexusphp}
      MYSQL_USER: ${DB_USERNAME:-nexusphp}
      MYSQL_PASSWORD: ${DB_PASSWORD:-nexusphp}
    volumes:
      - ${NP_MYSQL_DATA_PATH:-./mysql_data}:/var/lib/mysql
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet

  phpmyadmin:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    image: phpmyadmin/phpmyadmin
    container_name: nexusphp-phpmyadmin
    ports:
      - "${NP_HOST_BIND:-172.17.0.1}:${NP_PMA_PORT:-18081}:80"
    environment:
      PMA_HOST: ${DB_HOST:-host.docker.internal}
      PMA_PORT: ${DB_PORT:-13306}
    depends_on:
      - mysql
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet

networks:
  appnet:
