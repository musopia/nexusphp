name: Deploy Dev

# 手动触发：打包指定 ref 的代码 -> 上传服务器 -> 备份并部署。
# 凭据只放在 GitHub Secrets / Variables，不再提交到仓库。
#   Secrets: DEPLOY_KEY（必填）, ADMIN_PASSWORD（可选）
#   Variables: DEPLOY_HOST, DEPLOY_USER, DEPLOY_PORT, REMOTE_PACKAGE_DIR,
#              REMOTE_RUNNER, MODE, SYNC_ENV, ADMIN_USERNAME, ADMIN_EMAIL
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要部署的 git ref（分支 / tag / commit）"
        required: true
        default: "dev"
      run_install:
        description: "是否执行 auto-install（幂等，已装则跳过）"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

# 同一时间只允许一个 dev 发布
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Package and deploy to dev server
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      REMOTE_PACKAGE_DIR: ${{ vars.REMOTE_PACKAGE_DIR || '/opt/nexusphp-packages' }}
      REMOTE_RUNNER: ${{ vars.REMOTE_RUNNER || '/opt/nexusphp-deploy/deploy.sh' }}
      MODE: ${{ vars.MODE || 'dev' }}
      SYNC_ENV: ${{ vars.SYNC_ENV || 'false' }}
      ADMIN_USERNAME: ${{ vars.ADMIN_USERNAME || 'admin' }}
      ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      DEPLOY_REF: ${{ github.event.inputs.ref || 'dev' }}
      RUN_INSTALL: ${{ github.event.inputs.run_install || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'dev' }}
          fetch-depth: 1

      - name: Package code
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?secrets/variables 未配置 DEPLOY_HOST}"
          pkg="nexusphp-${GITHUB_SHA}.tar.gz"
          bash scripts/package.sh "$pkg" "$DEPLOY_REF"
          echo "PKG_NAME=$pkg" >> "$GITHUB_ENV"

      - name: Prepare SSH key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -Eeuo pipefail
          [ -n "$DEPLOY_KEY" ] || { echo "::error::secrets.DEPLOY_KEY 未配置"; exit 1; }
          key="$RUNNER_TEMP/deploy_key"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          known_hosts="$RUNNER_TEMP/known_hosts"
          echo "SSH_CMD=ssh -i $key -p $DEPLOY_PORT -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$known_hosts" >> "$GITHUB_ENV"
          echo "SCP_CMD=scp -i $key -P $DEPLOY_PORT -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$known_hosts" >> "$GITHUB_ENV"

      - name: Upload package
        run: |
          set -Eeuo pipefail
          target="$DEPLOY_USER@$DEPLOY_HOST"
          $SSH_CMD "$target" "mkdir -p '$REMOTE_PACKAGE_DIR'"
          $SCP_CMD "$PKG_NAME" "$target:$REMOTE_PACKAGE_DIR/"

      - name: Backup and deploy
        run: |
          set -Eeuo pipefail
          target="$DEPLOY_USER@$DEPLOY_HOST"
          admin_password_q=$(printf '%q' "${ADMIN_PASSWORD:-}")
          $SSH_CMD "$target" bash -s <<REMOTE
          set -Eeuo pipefail
          PKG="$REMOTE_PACKAGE_DIR/$PKG_NAME"
          RUNNER="$REMOTE_RUNNER"
          [ -f "\$PKG" ] || { echo "上传的代码包不存在: \$PKG" >&2; exit 1; }
          echo ">> package: \$PKG (\$(du -h "\$PKG" | cut -f1))"
          if [ ! -x "\$RUNNER" ]; then
            echo ">> 首次部署：从代码包 bootstrap 部署脚本"
            boot=\$(mktemp -d)
            tar xzf "\$PKG" -C "\$boot" ./scripts ./docker-compose.yml
            bash "\$boot/scripts/bootstrap-dev.sh" "\$PKG" --runner "\$RUNNER"
            rm -rf "\$boot"
          fi
          echo ">> deploy ref=$DEPLOY_REF run_install=$RUN_INSTALL"
          RUN_INSTALL="$RUN_INSTALL" MODE="$MODE" SYNC_ENV="$SYNC_ENV" \
            ADMIN_USERNAME="${ADMIN_USERNAME:-admin}" \
            ADMIN_EMAIL="${ADMIN_EMAIL:-}" \
            ADMIN_PASSWORD=$admin_password_q \
            "\$RUNNER" "\$PKG" "$DEPLOY_REF"
          REMOTE
